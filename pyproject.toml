[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcao-wannier"
version = "1.4.0"
description = "A computational engine for converting LCAO calculations to Wannier90 format"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "William Comaskey"}
]
keywords = ["wannier", "lcao", "computational-chemistry", "materials-science", "dft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
symmetry = ["spglib>=2.0"]
plot = ["matplotlib>=3.3.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "matplotlib>=3.3.0",
    "spglib>=2.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=0.5",
]
all = [
    "spglib>=2.0",
    "matplotlib>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/wcomaskey/lcao-wannier"
Documentation = "https://lcao-wannier.readthedocs.io"
Repository = "https://github.com/wcomaskey/lcao-wannier"
"Bug Tracker" = "https://github.com/wcomaskey/lcao-wannier/issues"

[project.scripts]
lcao2wannier = "lcao_wannier.cli:cli_main"

[tool.setuptools]
py-modules = ["lcao_to_wannier90"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["lcao_wannier"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
